services:
  - type: web
    name: iiitk-lms-api
    runtime: node
    region: oregon
    branch: main
    plan: free
    buildCommand: npm install && cd apps/api && npx tsc
    startCommand: node apps/api/dist/apps/api/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: "1h"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AXIOM_TOKEN
        sync: false
      - key: AXIOM_DATASET
        value: backend
      - key: FRONTEND_URL
        sync: false
